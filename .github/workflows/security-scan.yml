name: Security & Secret Leak Prevention

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Detection & Leak Prevention
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Native Repository Secret Scanner
        run: |
          python scripts/detect_secrets.py --all

      - name: Install & Run Gitleaks
        run: |
          # Download Gitleaks with retries to prevent transient 504 gateway timeouts
          curl -sSfL --retry 5 --retry-delay 2 --retry-connrefused \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.0/gitleaks_8.24.0_linux_x64.tar.gz \
            -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          sudo mv gitleaks /usr/local/bin/
          gitleaks detect --verbose --redact --config .gitleaks.toml
